name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: checker/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: go vet
        run: go -C checker vet ./...
      - name: go test
        run: go -C checker test -race ./...
      - run: npm run checker:build
      - run: npm run typecheck
      - run: npx biome ci .
      - run: npx vitest run
      - name: package builds and runs without tsx
        run: |
          npm run build
          node dist/index.js --version
