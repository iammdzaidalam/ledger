name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: |
            checker/go.mod
            server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: go vet
        run: go -C checker vet ./...
      - name: go test
        run: go -C checker test -race ./...
      - run: npm run checker:build
      - run: npm run typecheck
      - run: npx biome ci .
      - run: npx vitest run
      - name: package builds and runs without tsx
        run: |
          npm run build
          node dist/index.js --version

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      LEDGER_TEST_DATABASE_URL: postgres://ledger:ledger@localhost:5432/ledger?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: server/go.sum
      - name: go vet
        run: go -C server vet ./...
      - name: go test
        run: go -C server test -race -count=1 ./...
      - name: the service image builds
        run: docker build -f deploy/Dockerfile -t ledgerd .
