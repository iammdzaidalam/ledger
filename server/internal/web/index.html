<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Ledger Fleet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cg fill='%23888'%3E%3Ccircle cx='5' cy='5' r='2'/%3E%3Ccircle cx='12' cy='5' r='2'/%3E%3Ccircle cx='19' cy='5' r='2'/%3E%3Ccircle cx='5' cy='12' r='2'/%3E%3Ccircle cx='19' cy='12' r='2'/%3E%3Ccircle cx='5' cy='19' r='2'/%3E%3Ccircle cx='12' cy='19' r='2'/%3E%3Ccircle cx='19' cy='19' r='2'/%3E%3C/g%3E%3Ccircle cx='12' cy='12' r='2.6' fill='%231f5fd6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#main">Skip to detail</a>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor" opacity="0.35"><circle cx="5" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="19" r="2"/></g><circle cx="12" cy="12" r="2.6" fill="currentColor"/></svg>
    <span>Ledger Fleet</span>
    <span class="tag" id="demo-tag" hidden>demo</span>
  </div>
  <div class="grow"></div>
  <button class="btn" id="replay" type="button" hidden>Replay</button>
  <div class="conn" id="conn" role="status" data-s="connecting"><i></i><span>connecting</span></div>
</header>
<nav class="tabs" id="tabs" aria-label="Panels">
  <button type="button" data-pane="list" aria-pressed="true">List</button>
  <button type="button" data-pane="detail" aria-pressed="false">Detail</button>
  <button type="button" data-pane="feed" aria-pressed="false">Feed</button>
</nav>
<div class="app" id="app" data-pane="list">
  <aside class="pane rail" id="rail" aria-label="Swarms and runs">
    <div class="rail-head">
      <div class="seg" role="group" aria-label="List type">
        <button type="button" id="m-swarms" aria-pressed="true">Swarms</button>
        <button type="button" id="m-runs" aria-pressed="false">Runs</button>
      </div>
      <label class="sr" for="filter">Filter</label>
      <input class="filter" id="filter" type="search" placeholder="Filter (press /)" autocomplete="off" spellcheck="false">
    </div>
    <div class="list" id="list"></div>
  </aside>
  <main class="pane detail" id="main" tabindex="-1"></main>
  <aside class="pane feedpane" id="feedpane" aria-label="Event feed">
    <div class="feed-head">
      <h2>Events</h2>
      <div class="seg" role="group" aria-label="Feed scope">
        <button type="button" id="scope-swarm" aria-pressed="true">This swarm</button>
        <button type="button" id="scope-all" aria-pressed="false">All</button>
      </div>
      <button class="btn" id="pause" type="button" aria-pressed="false">Pause</button>
    </div>
    <ol class="feed" id="feed" aria-live="polite" aria-relevant="additions" aria-label="Events, newest first"></ol>
  </aside>
</div>
<footer class="stats" id="stats" hidden></footer>
<script src="demo.js"></script>
<script src="app.js"></script>
</body>
</html>
